name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check --select E9,F moltskin tests
      - name: Byte-compile
        run: python -m compileall -q moltskin tests
      - name: Smoke tests
        run: pytest -q tests/test_smoke.py tests/test_profile_observations.py
