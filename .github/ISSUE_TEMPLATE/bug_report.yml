name: Bug report
description: Something is broken or behaves unexpectedly
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Do not paste real cookies, proxy passwords, or API tokens.
  - type: input
    id: version
    attributes:
      label: Moltskin version
      description: Output of `git rev-parse --short HEAD` or the release tag.
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: Install method
      options:
        - Docker
        - Local (uv + uvicorn)
        - Other
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS and architecture
      placeholder: macOS 15 / Apple Silicon, Ubuntu 24.04 / x86_64, ...
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Create a profile
        2. Bind a proxy
        3. Click Open
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and logs
      description: Redact secrets. The runner log is under `data/run/<session>.log`.
    validations:
      required: true
