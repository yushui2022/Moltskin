<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>本窗口参数 · Moltskin</title>
  <link rel="icon" href="/favicon-32.png">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #f5f8f6; color: #182b24; font: 15px/1.6 system-ui, sans-serif; }
    main { max-width: 760px; margin: 0 auto; padding: 42px 24px; }
    .brand { display: flex; align-items: center; gap: 8px; color: #215d49; font: italic 600 22px Georgia, serif; }
    .brand img { width: 33px; height: 25px; }
    h1 { font-size: clamp(26px, 5vw, 36px); line-height: 1.25; margin: 32px 0 8px; }
    p { margin: 0; color: #53665c; }
    h2 { font-size: 16px; margin: 0 0 10px; }
    section { background: #fff; border: 1px solid #d6e1db; border-radius: 14px; padding: 18px 22px; margin-top: 18px; }
    dl { margin: 0; }
    dl > div { display: grid; grid-template-columns: minmax(145px, 35%) 1fr; gap: 8px; padding: 8px 0; }
    dl > div + div { border-top: 1px solid #edf1ef; }
    dt { color: #516159; }
    dd { margin: 0; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
    dd small { color: #64736a; display: block; }
    code { font: 13px/1.6 ui-monospace, monospace; }
    #copyUa { display: block; margin-top: 6px; padding: 2px 9px; border: 1px solid #b7cac0;
      border-radius: 5px; background: #fff; color: #215d49; font: inherit; font-size: 13px; cursor: pointer; }
    #copyUa[hidden] { display: none; }
    @media (max-width: 480px) {
      main { padding: 22px 14px; }
      section { padding: 14px 16px; }
      dl > div { grid-template-columns: 1fr 1.3fr; }
      dl > .wide { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main>
    <div class="brand" lang="en"><img src="/logo.svg" alt="">Moltskin</div>
    <h1>本窗口参数</h1>
    <p>这里显示当前网页能读到的值。要核对某个环境，请在那个环境里打开此页。</p>
    <noscript>请启用 JavaScript 以读取本窗口参数。</noscript>
    <section aria-labelledby="browser-heading">
      <h2 id="browser-heading">浏览器与系统</h2>
      <dl>
        <div><dt>Chromium 版本</dt><dd id="version">—</dd></div>
        <div><dt>平台</dt><dd id="platform">—</dd></div>
        <div><dt>系统版本 <small lang="en">UA-CH</small></dt><dd id="platformVersion">—</dd></div>
        <div><dt>处理器架构</dt><dd id="architecture">—</dd></div>
        <div><dt>网站语言</dt><dd id="language">—</dd></div>
        <div><dt>时区</dt><dd id="timezone">—</dd></div>
        <div class="wide"><dt>HTTP 请求头 UA</dt><dd><code id="httpUa">__HTTP_USER_AGENT__</code></dd></div>
        <div class="wide"><dt>网页读取的 UA</dt><dd><code id="ua">—</code>
          <button type="button" id="copyUa" hidden>复制 UA</button><small id="copyMessage" role="status"></small></dd></div>
      </dl>
    </section>
    <section aria-labelledby="hardware-heading">
      <h2 id="hardware-heading">硬件与显示</h2>
      <dl>
        <div><dt>硬件并发数</dt><dd><span id="cpu">—</span><small>浏览器报告的逻辑处理器数量</small></dd></div>
        <div><dt>设备内存</dt><dd><span id="memory">—</span><small>浏览器公开的近似内存档位</small></dd></div>
        <div><dt>JS 堆大小上限</dt><dd><span id="heap">—</span><small>包含老生代与其他堆空间</small></dd></div>
        <div><dt>屏幕尺寸</dt><dd id="screen">—</dd></div>
        <div><dt>窗口外框</dt><dd id="outer">—</dd></div>
        <div><dt>页面视口</dt><dd id="inner">—</dd></div>
        <div><dt>设备像素比</dt><dd id="dpr">—</dd></div>
      </dl>
    </section>
    <section aria-labelledby="graphics-heading">
      <h2 id="graphics-heading">图形隐私实测</h2>
      <dl>
        <div><dt>Canvas 2D 像素读取</dt><dd id="canvasReadback">—</dd></div>
        <div><dt>WebGL 显卡调试信息</dt><dd id="webglDebugInfo">—</dd></div>
      </dl>
    </section>
  </main>
  <script>
    const unavailable = "浏览器未提供";
    function show(id, value) {
      document.getElementById(id).textContent = value ?? unavailable;
    }
    function checkGraphics() {
      const canvas = document.createElement("canvas");
      canvas.width = canvas.height = 1;
      const ctx = canvas.getContext("2d");
      if (ctx) {
        ctx.fillStyle = "#00ff00";
        ctx.fillRect(0, 0, 1, 1);
        try {
          const rgba = ctx.getImageData(0, 0, 1, 1).data;
          show("canvasReadback", rgba.join(",") === "0,255,0,255" ? "可读取测试像素" : "读取值与测试色不同");
        } catch (error) {
          show("canvasReadback", error.name === "SecurityError" ? "已阻止读取" : "读取失败");
        }
      } else {
        show("canvasReadback", "Canvas 2D 不可用");
      }
      const gl = document.createElement("canvas").getContext("webgl");
      const ext = gl?.getExtension("WEBGL_debug_renderer_info");
      if (!gl) show("webglDebugInfo", "WebGL 不可用");
      else if (!ext) show("webglDebugInfo", "调试扩展不可用");
      else show("webglDebugInfo", [gl.getParameter(ext.UNMASKED_VENDOR_WEBGL), gl.getParameter(ext.UNMASKED_RENDERER_WEBGL)].filter(Boolean).join(" · ") || "扩展未提供型号");
      gl?.getExtension("WEBGL_lose_context")?.loseContext();
    }
    checkGraphics();
    function showGeometry() {
      show("screen", screen.width + " × " + screen.height + " CSS px");
      show("outer", outerWidth + " × " + outerHeight + " CSS px");
      show("inner", innerWidth + " × " + innerHeight + " CSS px");
      show("dpr", window.devicePixelRatio);
    }
    show("ua", navigator.userAgent);
    const copyUa = document.getElementById("copyUa");
    copyUa.hidden = false;
    copyUa.addEventListener("click", async () => {
      const source = document.getElementById("ua");
      try {
        await navigator.clipboard.writeText(source.textContent);
        show("copyMessage", "已复制");
      } catch {
        window.getSelection().selectAllChildren(source);
        show("copyMessage", "文本已选中，可手动复制。");
      }
    });
    show("platform", navigator.userAgentData?.platform || navigator.platform);
    show("language", navigator.languages.join("、") || navigator.language);
    show("timezone", Intl.DateTimeFormat().resolvedOptions().timeZone);
    show("cpu", navigator.hardwareConcurrency);
    show("memory", navigator.deviceMemory ? navigator.deviceMemory + " GiB" : null);
    const heapLimit = performance.memory?.jsHeapSizeLimit;
    show("heap", heapLimit ? Math.round(heapLimit / 1048576) + " MiB" : null);
    showGeometry();
    window.addEventListener("resize", showGeometry);
    async function showPlatformHints() {
      try {
        const hints = await navigator.userAgentData?.getHighEntropyValues(
          ["fullVersionList", "platformVersion", "architecture", "bitness"]);
        show("version", hints?.fullVersionList?.find(entry => entry.brand === "Chromium")?.version);
        show("platformVersion", hints?.platformVersion || unavailable);
        show("architecture", [hints?.architecture, hints?.bitness && hints.bitness + " 位"].filter(Boolean).join(" · ") || unavailable);
      } catch {
        for (const id of ["version", "platformVersion", "architecture"]) show(id, unavailable);
      }
    }
    showPlatformHints();
  </script>
</body>
</html>
